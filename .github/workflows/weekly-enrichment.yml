name: metric11 haftalik derin veri zenginlestirme

on:
  workflow_dispatch:
  schedule:
    # Cumartesi 01:30 UTC: oyuncu profilleri, biyometri ve uzun dönem H2H/form.
    - cron: "30 1 * * 6"

permissions:
  contents: write

jobs:
  weekly-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Haftalik profil ve gecmis taramasi
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_CREDENTIALS_HASH: ${{ secrets.ADMIN_CREDENTIALS_HASH }}
        run: python -m src.run_daily_pipeline --include-network --network-profile heavy

      - name: Commit and push generated outputs
        if: always()
        run: |
          git config --global user.email "257049215+alican-thumb@users.noreply.github.com"
          git config --global user.name "alican-thumb"
          git add data/processed/
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: weekly enrichment $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Deploy to Vercel
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
