name: metric11 haber yenileme (gunde 6 kez)

on:
  workflow_dispatch:
  schedule:
    # Haber toplama: 02:15, 06:15, 10:15, 14:15, 18:15, 22:15 UTC (her 4 saatte bir).
    # daily-pipeline 04:00 UTC'de tam ağ yenilemesi yapar — 06:15 onu takip eder.
    - cron: "15 2,6,10,14,18,22 * * *"

permissions:
  contents: write

jobs:
  news-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Haber topla
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.collect_news_rss || true
          python -m src.collect_news_google || true
          python -m src.collect_news_telegram || true
          python -m src.collect_official_club_news || true

      - name: Haber raporlarını güncelle
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_CREDENTIALS_HASH: ${{ secrets.ADMIN_CREDENTIALS_HASH }}
        run: |
          python -m src.analyze_news_with_claude --only-relevant || true
          python -m src.build_news_intelligence_report || true
          python -m src.build_source_performance_report || true
          python -m src.build_transfer_tracker || true
          python -m src.build_transfer_season_context || true
          python -m src.build_live_feed || true
          python -m src.build_product_home || true
          python -m src.build_status_page || true
          python -m src.build_admin_page || true

      - name: Commit and push
        if: always()
        run: |
          git config --global user.email "257049215+alican-thumb@users.noreply.github.com"
          git config --global user.name "alican-thumb"
          git add data/processed/
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: haber yenileme $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --no-rebase -X ours origin main
          git push origin main
