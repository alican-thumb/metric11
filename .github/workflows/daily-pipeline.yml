name: metric11 full network pipeline

on:
  workflow_dispatch:
    inputs:
      include_network:
        description: "Run network collectors (TFF, Transfermarkt, haberler)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Her gece 04:00 UTC — TFF + Transfermarkt + haberler + dashboard (~30-45 dk)
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (network dahil)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.include_network == 'true' }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ADMIN_CREDENTIALS_HASH: ${{ secrets.ADMIN_CREDENTIALS_HASH }}
        run: python -m src.run_daily_pipeline --include-network

      - name: Run pipeline (network yok)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_network == 'false' }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_CREDENTIALS_HASH: ${{ secrets.ADMIN_CREDENTIALS_HASH }}
        run: python -m src.run_daily_pipeline

      - name: Commit and push generated outputs
        if: always()
        run: |
          git config --global user.email "257049215+alican-thumb@users.noreply.github.com"
          git config --global user.name "alican-thumb"
          git add data/processed/
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: full pipeline $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --rebase origin main
          git push origin main
