name: metric11 dashboard refresh

on:
  workflow_dispatch:
  schedule:
    # Her 6 saatte bir: 00:15, 06:15, 12:15, 18:15 UTC
    # Haber akışı + dashboard yenileme, network scraper yok (~5 dk)
    - cron: "15 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Haber topla (news-refresh fallback)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.collect_news_rss
          python -m src.collect_news_google
          python -m src.collect_official_club_news
          python -m src.analyze_news_with_claude --only-relevant
          python -m src.build_news_intelligence_report
          python -m src.build_transfer_tracker
          python -m src.build_live_feed

      - name: Rebuild dashboards
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_CREDENTIALS_HASH: ${{ secrets.ADMIN_CREDENTIALS_HASH }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python -m src.run_daily_pipeline

      - name: Commit and push
        run: |
          git config --global user.email "257049215+alican-thumb@users.noreply.github.com"
          git config --global user.name "alican-thumb"
          git add data/processed/
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --rebase origin main
          git push origin main
