name: metric11 dashboard refresh

on:
  workflow_dispatch:
  schedule:
    # Her 6 saatte bir: 00:15, 06:15, 12:15, 18:15 UTC
    # Haber akışı + dashboard yenileme, network scraper yok (~5 dk)
    - cron: "15 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Haber topla (news-refresh fallback)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python -m src.collect_worldcup_fixtures || true
          python -m src.analyze_worldcup_predictions || true
          python -m src.build_worldcup_predictions || true
          python -m src.collect_european_fixtures || true
          python -m src.collect_news_rss || true
          python -m src.collect_news_google || true
          python -m src.collect_official_club_news || true
          python -m src.analyze_news_with_claude --only-relevant || true
          python -m src.build_news_intelligence_report || true
          python -m src.build_transfer_tracker || true
          python -m src.build_european_news_pulse || true
          python -m src.analyze_european_predictions || true
          python -m src.build_european_predictions || true
          python -m src.build_live_feed || true
          python -m src.notify_telegram || true

      - name: Rebuild dashboards
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_CREDENTIALS_HASH: ${{ secrets.ADMIN_CREDENTIALS_HASH }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python -m src.run_daily_pipeline || true

      - name: Commit and push
        if: always()
        run: |
          git config --global user.email "257049215+alican-thumb@users.noreply.github.com"
          git config --global user.name "alican-thumb"
          git add data/processed/
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --no-rebase -X ours origin main
          git push origin main

      - name: Deploy to Vercel (metric11.com)
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
