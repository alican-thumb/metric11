name: metric11 dashboard refresh

on:
  workflow_dispatch:
  schedule:
    # Her 6 saatte bir: 00:15, 06:15, 12:15, 18:15 UTC
    # Haber akışı + dashboard yenileme, network scraper yok (~5 dk)
    - cron: "15 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dünya Kupası + Avrupa fikstürlerini güncelle
        # Haber toplama/analiz adımları BURADAN KALDIRILDI (2026-09-16): news-refresh.yml
        # zaten aynı işi günde 6 kez (bu workflow'un 4 katı sıklıkta) yapıyor — tam bir
        # kopyaydı ve GitHub Actions'ın private repo için ücretsiz 2000 dk/ay limitinin
        # neredeyse tamamını (~%68'i tek bu adımdan, ölçülen: run 35090327281'de 4dk32sn/
        # 6dk37sn) tüketiyordu. Bu adım sadece news-refresh.yml'nin KAPSAMADIĞI iki
        # fikstür kaynağını (Dünya Kupası + Avrupa Ligi) burada tutuyor, geri kalanı
        # news-refresh.yml'ye devredildi.
        continue-on-error: true
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          # Dünya Kupası 2026 Temmuz'da bitti: fikstür artık çekilmiyor, sayfa
          # run_daily_pipeline içinde mevcut veriden arşiv olarak üretiliyor.
          python -m src.collect_european_fixtures || true

      - name: Maç sonuçlarını çek (hafif TFF fikstür, retry amaçlı)
        # Günlük tam ağ pipeline'ı (04:00 UTC, --include-network) TFF'nin fikstür
        # listeleme sayfasını CI'nin bulut IP'sinden bazen boş/"-" skorla çekiyor
        # (Transfermarkt kadro verisinde de görülen aynı CDN/anti-bot deseni,
        # bkz. 2026-09-13 "dünkü maçlar güncellenmedi" bulgusu). Bu adım olmadan
        # o günkü koşu kaçırırsa sonuç 24 saat "-" kalıyordu. collect_tff_season_
        # fixture zaten bilinen gerçek skorları asla "-" ile ezmiyor (bkz. script
        # içindeki existing_scores koruması), o yüzden 6 saatte bir tekrar
        # denemek güvenli — en kötü ihtimalle hiçbir şey değişmez.
        continue-on-error: true
        run: |
          python -m src.collect_tff_season_fixture || true
          python -m src.advance_season_state || true

      - name: Rebuild dashboards
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_CREDENTIALS_HASH: ${{ secrets.ADMIN_CREDENTIALS_HASH }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python -m src.run_daily_pipeline || true

      - name: Telegram bildirimi gönder
        # notify_telegram tüm repoda SADECE burada çağrılıyordu (news-refresh.yml bunu
        # hiç çağırmıyor) — yukarıdaki kaldırma sırasında yanlışlıkla silinmesin diye
        # ayrı, ucuz bir adım olarak tutuluyor. Ağır değil: sadece transfer_tracker
        # JSON'unu okuyup yeni sinyalleri postalıyor, scraping/LLM çağrısı yok.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m src.notify_telegram || true

      - name: Commit and push
        if: always()
        run: |
          git config --global user.email "257049215+alican-thumb@users.noreply.github.com"
          git config --global user.name "alican-thumb"
          git add data/processed/
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --no-rebase -X ours origin main
          git push origin main

      - name: Deploy to Vercel (metric11.com)
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
