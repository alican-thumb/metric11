name: metric11 dashboard refresh

on:
  schedule:
    # Her 6 saatte bir: 00:15, 06:15, 12:15, 18:15 UTC
    # Haber akışı + dashboard yenileme, network scraper yok (~5 dk)
    - cron: "15 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild dashboards
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.run_daily_pipeline

      - name: Commit and push
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          git add data/processed/
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push origin main
